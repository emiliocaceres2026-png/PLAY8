name: Ejecutar Bot Premium Telethon

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: telethon-userbot-singleton
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install telethon cryptg

      # Restaura el archivo de sesión guardado como Secret en GitHub
      - name: Restaurar sesion de Telethon
        if: env.TELETHON_SESSION_BASE64 != ''
        env:
          TELETHON_SESSION_BASE64: ${{ secrets.TELETHON_SESSION_BASE64 }}
        run: |
          echo "$TELETHON_SESSION_BASE64" | base64 --decode > sesion_premium.session

      - name: Ejecutar bot_premium.py
        run: |
          python -u bot_premium.py
